  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, .35, "triangle", .1, i * .12)); },
  alarm() { beep(440, .2, "square", .07); beep(330, .2, "square", .07, .22); }
};

/* ===== Konfetti ===== */
const cv = $("fx"), cx = cv.getContext("2d");
let parts = [], raf = null;
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ffc533", "#22b35e", "#2f7cf6", "#e8414f", "#ffffff"];
  for (let i = 0; i < 220; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 300, y: innerHeight / 3, vx: (Math.random() - .5) * 18, vy: Math.random() * -15 - 4, s: 6 + Math.random() * 9, c: cols[i % 5], r: Math.random() * 6, life: 180 });
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += .2; p.life--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0, 0, cv.width, cv.height), null);
}

/* =========================================================
   HOST
   ========================================================= */
const H = { peer: null, pin: "", players: new Map(), qi: -1, q: null, order: [], answers: new Map(), qStart: 0, timer: null, hack: 0, phase: "lobby", digits: [] };

function hostCreate() {
  if (typeof Peer === "undefined") { view(`<div class="panel"><div class="err">PeerJS konnte nicht geladen werden. Prüf die Internetverbindung und lade neu.</div></div>`); return; }
  view(`<div class="panel center" style="min-height:50vh"><div class="spinner"></div><p class="hint">Raum wird erstellt …</p></div>`);
  const pin = String(Math.floor(100000 + Math.random() * 900000));
  const peer = new Peer(PREFIX + pin, peerOpts());
  peer.on("open", () => { H.peer = peer; H.pin = pin; hostLobby(); });
  peer.on("error", err => {
    if (err.type === "unavailable-id") { peer.destroy(); hostCreate(); return; }
    if (H.peer) return; // Fehler einzelner Verbindungen ignorieren
    view(`<div class="panel"><div class="err">Raum konnte nicht erstellt werden (${esc(err.type || "Fehler")}). Prüf die Internetverbindung und versuch es nochmal.</div><button class="btn" onclick="location.reload()">Neu laden</button></div>`);
  });
  peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) {} });
  peer.on("connection", conn => hostConn(conn));
}

function hostConn(conn) {
  conn.on("data", d => hostData(conn, d));
  conn.on("close", () => {
    for (const p of H.players.values()) if (p.conn === conn) { p.online = false; }
    if (H.phase === "lobby") hostRenderPlayers();
    hostUpdateCount();
  });
}
function send(conn, msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) {} }
function broadcast(msg) { for (const p of H.players.values()) if (p.online) send(p.conn, msg); }

function hostData(conn, d) {
  if (!d || typeof d !== "object") return;
  if (d.t === "join") {
    const name = cleanName(d.name);
    if (!name) return send(conn, { t: "reject", why: "Ungültiger Nickname." });
    const key = name.toLowerCase();
    const ex = H.players.get(key);
    if (ex && ex.online && ex.conn !== conn) return send(conn, { t: "reject", why: "Den Nickname gibt es schon. Nimm einen anderen." });
    if (!ex && H.players.size >= 60) return send(conn, { t: "reject", why: "Der Raum ist voll." });
    const p = ex || { name, score: 0, streak: 0, last: 0, correct: 0 };
    p.conn = conn; p.online = true;
    H.players.set(key, p);
    send(conn, { t: "welcome", name: p.name, score: p.score });
    if (!ex) sfx.join();
    if (H.phase === "lobby") hostRenderPlayers();
    else if (H.phase === "question") send(conn, hostQMsg());
    else if (H.phase === "end") send(conn, hostEndMsg(p));
    else send(conn, { t: "wait", score: p.score });
    hostUpdateCount();
    return;
  }
  if (d.t === "ans") {
    if (H.phase !== "question" || d.i !== H.qi) return;
    const p = [...H.players.values()].find(x => x.conn === conn);
    if (!p || H.answers.has(p.name.toLowerCase())) return;
    const k = Number(d.k);
    if (!Number.isInteger(k) || k < 0 || k >= H.order.length) return;
    H.answers.set(p.name.toLowerCase(), { k, ms: Date.now() - H.qStart });
    send(conn, { t: "got" });
    hostUpdateCount();
    const online = [...H.players.values()].filter(x => x.online).length;
    if (H.answers.size >= online) hostReveal();
  }
}

function hostUpdateCount() {
  const online = [...H.players.values()].filter(x => x.online).length;
  const pc = $("pcount"); if (pc) pc.innerHTML = `<b>${online}</b> ${online === 1 ? "Spieler" : "Spieler"}`;
  const ac = $("ansCount"); if (ac) ac.textContent = H.answers.size;
  const sb = $("startBtn"); if (sb) sb.disabled = online < 1;
}

function hostLobby() {

function hostBar() {
  return `<div class="hostbar">

function hostStart() {
  H.qi = -1; H.hack = 0; H.digits = [];
  for (const p of H.players.values()) { p.score = 0; p.streak = 0; p.correct = 0; p.last = 0; }
  hostNext();
}
function hostQMsg() {
  const q = QUESTIONS[H.qi];
  return { t: "q", i: H.qi, n: QUESTIONS.length, q: q.q, opts: H.order.map(o => o.t), tf: !!q.tf, boss: !!q.boss, limit: q.tf ? LIMIT_TF : LIMIT, left: Math.max(0, (q.tf ? LIMIT_TF : LIMIT) - (Date.now() - H.qStart) / 1000) };
}
function hostNext() {
  H.qi++;
  if (H.qi >= QUESTIONS.length) return hostFinal();
  const q = QUESTIONS[H.qi];
  H.order = q.tf ? q.a.map((t, k) => ({ t, right: k === 0 })).sort((a, b) => (a.t === "Wahr" ? -1 : 1)) : shuffle(q.a.map((t, k) => ({ t, right: k === 0 })));
  H.answers = new Map();
  H.phase = "intro";
  broadcast({ t: "get", i: H.qi, n: QUESTIONS.length, boss: !!q.boss });
  view(`${hostBar()}
    <div class="panel center" style="min-height:52vh">
      <span class="tag ${q.boss ? "boss" : ""}" style="align-self:center">Frage ${H.qi + 1} von ${QUESTIONS.length} · ${esc(q.cat)}${q.boss ? " · doppelte Punkte" : ""}</span>
      <div class="qbox" style="width:100%">${esc(q.q)}</div>
      <div class="spinner"></div>
    </div>`);
  if (q.boss) sfx.alarm();
  setTimeout(hostQuestion, 3000);
}
function hostQuestion() {
  const q = QUESTIONS[H.qi], limit = q.tf ? LIMIT_TF : LIMIT;
  H.phase = "question"; H.qStart = Date.now();
  broadcast(hostQMsg());
  const shapeIdx = q.tf ? [3, 0] : [0, 1, 2, 3];
  view(`${hostBar()}
    <div class="panel">
      <div class="qbox">${esc(q.q)}</div>
      <div class="qmid">
        <div class="clock" id="clock">${limit}</div>
        <div class="qart">${q.boss ? BOT_SVG.replace('width="52" height="52"', 'width="120" height="120"') : `<span>${esc(q.cat)}</span>`}</div>
        <div class="answered"><b id="ansCount">0</b><span>Antworten</span></div>
      </div>
      <div class="tiles">${H.order.map((o, k) => `<div class="tile c${shapeIdx[k]}">${SHAPES[shapeIdx[k]]}<span>${esc(o.t)}</span></div>`).join("")}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn small" id="skipBtn">Auflösen</button></div>
    </div>`);
  $("skipBtn").onclick = hostReveal;
  hostUpdateCount();
  clearInterval(H.timer);
  H.timer = setInterval(() => {
    const left = Math.max(0, limit - (Date.now() - H.qStart) / 1000);
    const c = $("clock"); if (!c) return;
    const s = Math.ceil(left);
    if (c.textContent !== String(s)) { c.textContent = s; if (s <= 5 && s > 0) sfx.tick(); }
    c.classList.toggle("low", left <= 5);
    if (left <= 0) hostReveal();
  }, 100);
}
function hostReveal() {
  if (H.phase !== "question") return;
  H.phase = "reveal"; clearInterval(H.timer);
  const q = QUESTIONS[H.qi], limit = (q.tf ? LIMIT_TF : LIMIT) * 1000;
  const rightK = H.order.findIndex(o => o.right);
  const counts = H.order.map(() => 0);
  let right = 0, total = 0;
  for (const p of H.players.values()) {
    const a = H.answers.get(p.name.toLowerCase());
    p.last = 0;
    if (!p.online && !a) continue;
    total++;
    if (a) counts[a.k]++;
    if (a && a.k === rightK) {
      right++; p.streak++; p.correct++;
      let pts = Math.round(1000 * (1 - Math.min(1, a.ms / limit) / 2));
      if (p.streak >= 2) pts += Math.min(5, p.streak - 1) * 100;
      if (q.boss) pts *= 2;
      p.score += pts; p.last = pts;
    } else p.streak = 0;
  }
  const wrongShare = total ? 1 - right / total : 1;
  const before = H.hack;
  H.hack = Math.min(100, H.hack + Math.round(wrongShare * (q.boss ? 40 : 15)));
  if (H.digits.length < 4 && DIGIT_AT[H.qi] !== undefined && right / Math.max(1, total) >= .5) H.digits.push(DIGIT_AT[H.qi]);
  const ranked = hostRanked();
  for (const p of H.players.values()) {
    const a = H.answers.get(p.name.toLowerCase());
    send(p.conn, { t: "res", ok: !!a && a.k === rightK, answered: !!a, pts: p.last, score: p.score, streak: p.streak, rank: ranked.indexOf(p) + 1, of: ranked.length, right: H.order[rightK].t });
  }
  const shapeIdx = q.tf ? [3, 0] : [0, 1, 2, 3];
  const max = Math.max(1, ...counts);
  sfx.reveal();
  view(`${hostBar()}
    <div class="panel">
      <div class="qbox">${esc(q.q)}</div>
      <div class="bars" style="--n:${H.order.length}">${H.order.map((o, k) => `<div class="barc ${k === rightK ? "" : "dim"}"><span class="v">${counts[k]}</span><div class="b c${shapeIdx[k]}" style="height:${44 + counts[k] / max * 100}px">${k === rightK ? CHECK : SHAPES[shapeIdx[k]]}</div></div>`).join("")}</div>
      <div class="tiles">${H.order.map((o, k) => `<div class="tile c${shapeIdx[k]} ${k === rightK ? "win" : "dim"}">${SHAPES[shapeIdx[k]]}<span>${esc(o.t)}</span>${k === rightK ? CHECK : ""}</div>`).join("")}</div>
      <div class="row" style="justify-content:space-between">
        <p class="hint" style="font-size:18px">${right} von ${total} richtig${H.hack > before ? ` · BruteBot +${H.hack - before}%` : " · BruteBot kommt nicht weiter"}</p>
        <button class="btn gold" id="nextBtn">Weiter</button>
      </div>
    </div>`);
  if (H.hack > before) { const b = $("bot"); if (b) b.classList.add("hit"); }
  if (H.digits.length && H.digits[H.digits.length - 1] === DIGIT_AT[H.qi]) sfx.digit();
  $("nextBtn").onclick = () => (H.qi >= QUESTIONS.length - 1 ? hostFinal() : hostScoreboard());
  $("nextBtn").focus();
}
function hostRanked() { return [...H.players.values()].sort((a, b) => b.score - a.score); }
function hostScoreboard() {
  H.phase = "board";
  const top = hostRanked().slice(0, 5);
  broadcast({ t: "wait" });
  view(`${hostBar()}
    <div class="head">Rangliste</div>
    <div class="sboard">${top.map((p, i) => `<div class="srow ${i === 0 ? "first" : ""}"><span class="pl">${i + 1}</span><span class="nm">${esc(p.name)}${p.streak >= 3 ? `<small>Streak ${p.streak}</small>` : ""}</span><span class="sc">${p.score}</span></div>`).join("")}</div>
    <div class="row center"><button class="btn gold" id="nextBtn">Nächste Frage</button></div>`);
  $("nextBtn").onclick = hostNext; $("nextBtn").focus();
}
function hostEndMsg(p) {
  const ranked = hostRanked();
  return { t: "end", rank: ranked.indexOf(p) + 1, of: ranked.length, score: p.score, correct: p.correct, n: QUESTIONS.length, safe: H.hack < 100 };
}
function hostFinal() {
  H.phase = "end"; clearInterval(H.timer);
  const ranked = hostRanked(), top = ranked.slice(0, 3);
  for (const p of H.players.values()) send(p.conn, hostEndMsg(p));
  const safe = H.hack < 100;
  view(`${hostBar()}
    <div class="head ${safe ? "" : "red"}">${safe ? "Tresor gerettet! Code 2568" : "BruteBot hat den Tresor geknackt"}</div>
    <div class="podium" style="margin-top:20px">${[1, 0, 2].map(i => top[i] ? `<div class="pod p${i + 1} reveal"><span class="nm">${esc(top[i].name)}</span><span class="sc">${top[i].score} Punkte</span><div class="blk">${i + 1}</div></div>` : `<div class="pod p${i + 1}"><span class="nm" style="color:#4a5190">frei</span><span class="sc">&nbsp;</span><div class="blk" style="opacity:.3">${i + 1}</div></div>`).join("")}</div>
    <div class="row center"><button class="btn" id="againBtn">Nochmal spielen</button></div>`);
  setTimeout(() => { sfx.win(); confetti(); }, 2100);
  $("againBtn").onclick = () => { broadcast({ t: "lobby" }); for (const p of H.players.values()) { p.score = 0; p.streak = 0; } H.hack = 0; H.digits = []; hostLobby(); };
}

/* =========================================================
   SPIELER
   ========================================================= */
const P = { peer: null, conn: null, name: "", pin: "", score: 0, qi: -1, answered: false, retry: 0 };

function playerJoin(pin, name) {
  if (typeof Peer === "undefined") { const er = $("joinErr"); er.hidden = false; er.textContent = "Verbindung nicht möglich. Prüf das Internet und lade neu."; return; }
  P.pin = pin; P.name = name;
  view(`<div class="phone"><div class="bigmsg"><div class="spinner"></div><div class="s">Verbinde mit Raum ${esc(pin)} …</div></div></div>`);
  if (P.peer) { try { P.peer.destroy(); } catch (e) {} }
  const peer = new Peer(peerOpts());
  P.peer = peer;
  peer.on("open", () => {
    const conn = peer.connect(PREFIX + pin, { reliable: true });
    P.conn = conn;
    const t = setTimeout(() => { if (!conn.open) playerFail("Keine Antwort vom Raum. Stimmt der PIN?"); }, 12000);
    conn.on("open", () => { clearTimeout(t); P.retry = 0; send(conn, { t: "join", name }); });
    conn.on("data", playerData);
    conn.on("close", () => playerLost());
  });
  peer.on("error", err => {
    if (err.type === "peer-unavailable") playerFail("Diesen Game PIN gibt es nicht. Schau nochmal auf den Beamer.");
    else if (!P.conn || !P.conn.open) playerFail("Verbindung fehlgeschlagen (" + (err.type || "Fehler") + ").");
  });
}
function playerLost() {
  if (P.retry >= 3) return playerFail("Verbindung zum Raum verloren.");
  P.retry++;
  view(`<div class="phone"><div class="bigmsg"><div class="spinner"></div><div class="s">Verbindung weg, versuche es nochmal …</div></div></div>`);
  setTimeout(() => playerJoin(P.pin, P.name), 1500);
}
function playerFail(msg) {
  document.body.className = "";
  view(`<div class="phone"><div class="bigmsg"><div class="t">Hoppla</div><div class="s">${esc(msg)}</div><button class="btn" id="back">Zurück</button></div></div>`);
  $("back").onclick = () => { try { P.peer && P.peer.destroy(); } catch (e) {} P.retry = 99; home(); };
}
function ptop() { return `<div class="ptop"><span class="nm">${esc(P.name)}</span><span class="sc">${P.score}</span></div>`; }
function playerWait(title, sub) {
  document.body.className = "";
  view(`<div class="phone">${ptop()}<div class="bigmsg"><div class="t">${title}</div><div class="s">${sub}</div><div class="spinner"></div></div></div>`);
}
function playerData(d) {
  if (!d || typeof d !== "object") return;
  if (d.t === "reject") { P.retry = 99; try { P.conn.close(); } catch (e) {} return playerFail(d.why || "Beitreten nicht möglich."); }
  if (d.t === "welcome") {
    P.name = cleanName(d.name) || P.name; P.score = Number(d.score) || 0;
    document.body.className = "";
    view(`<div class="phone"><div class="bigmsg"><div class="t">Du bist drin!</div><div class="mechip">${esc(P.name)}</div><div class="s">Siehst du deinen Namen am Beamer?</div><div class="spinner"></div></div></div>`);
    return;
  }
  if (d.t === "lobby") { P.score = 0; return playerWait("Neue Runde", "Gleich gehts wieder los."); }
  if (d.t === "wait") { if (typeof d.score === "number") P.score = d.score; return playerWait("Schau zum Beamer", "Gleich kommt die nächste Frage."); }
  if (d.t === "get") return playerWait(d.boss ? "Endgegner!" : "Frage " + (d.i + 1), d.boss ? "Doppelte Punkte. Mach dich bereit." : "Mach dich bereit …");
  if (d.t === "q") {
    P.qi = d.i; P.answered = false; document.body.className = "";
    const opts = Array.isArray(d.opts) ? d.opts.slice(0, 4) : [];
    const shapeIdx = d.tf ? [3, 0] : [0, 1, 2, 3];
    view(`<div class="phone">${ptop()}
      <div class="ptiles ${opts.length === 2 ? "two" : ""}">${opts.map((t, k) => `<button class="ptile c${shapeIdx[k]}" data-k="${k}">${SHAPES[shapeIdx[k]]}<span>${esc(String(t))}</span></button>`).join("")}</div></div>`);
    app.querySelectorAll(".ptile").forEach(b => b.onclick = () => {
      if (P.answered) return;
      P.answered = true;
      send(P.conn, { t: "ans", i: P.qi, k: +b.dataset.k });
      playerWait("Antwort gesendet", "Mal sehen, ob du schneller warst …");
    });
    return;
  }
  if (d.t === "got") return;
  if (d.t === "res") {
    P.score = Number(d.score) || 0;
    document.body.className = d.ok ? "ok" : "no";
    if (d.ok) sfx.right(); else sfx.wrong();
    view(`<div class="phone">${ptop()}<div class="bigmsg">
      <div class="t">${d.ok ? "Richtig!" : d.answered ? "Falsch!" : "Zu langsam!"}</div>
      ${d.ok ? `<div class="pts">+${d.pts}</div>` : `<div class="s">Richtig war: ${esc(String(d.right || ""))}</div>`}
      ${d.ok && d.streak >= 2 ? `<div class="s">Streak ${d.streak}</div>` : ""}
      <div class="s">Du bist auf Platz ${d.rank} von ${d.of}</div></div></div>`);
    return;
  }
  if (d.t === "end") {
    P.score = Number(d.score) || 0;
    document.body.className = "";
    const place = d.rank === 1 ? "1. Platz!" : d.rank === 2 ? "2. Platz!" : d.rank === 3 ? "3. Platz!" : "Platz " + d.rank;
    if (d.rank <= 3) { sfx.win(); confetti(); }
    view(`<div class="phone">${ptop()}<div class="bigmsg">
      <div class="t">${place}</div>
      <div class="pts">${d.score} Punkte</div>
      <div class="s">${d.correct} von ${d.n} richtig · ${d.of} Spieler</div>
      <div class="s">${d.safe ? "Die Klasse hat den Tresor gerettet." : "BruteBot hat den Klassen Tresor geknackt."}</div></div></div>`);
  }
}

home();
</script>
</body>
</html>
